# ==========================================================================
#  Site
# ==========================================================================

locale                   : "en-US"
title                    : "Reza Shirkavand"
title_separator          : "·"
name                     : &name "Reza Shirkavand"
description              : &description "PhD candidate in Computer Science at the University of Maryland, working on adaptive AI."
url                      : "https://rezashkv.github.io"
baseurl                  : ""
repository               : "rezashkv/rezashkv.github.io"
seo_description          : *description
og_image                 : "thumbs/bio-photo.jpg"   # seo.html prepends /images/

words_per_minute         : 160
future                   : true

atom_feed:
  path                   :

# ==========================================================================
#  Verification / social
# ==========================================================================

google_site_verification :
bing_site_verification   :

twitter:
  username               : &twitter "reza_shkv"

social:
  type                   : Person
  name                   : *name
  links:
    - "https://x.com/reza_shkv"
    - "https://github.com/rezashkv"
    - "https://www.linkedin.com/in/reza-shirkavand-3b508612b/"
    - "https://scholar.google.com/citations?user=uS4nCAMAAAAJ&hl=en"

analytics:
  provider               : false
  google:
    tracking_id          :

# ==========================================================================
#  Author
# ==========================================================================

author:
  name             : *name
  avatar           : "bio-photo.jpg"
  bio              : "PhD candidate in Computer Science at the University of Maryland."
  location         : "Washington, D.C."
  email            : "rezashkv@umd.edu"
  googlescholar    : "https://scholar.google.com/citations?user=uS4nCAMAAAAJ&hl=en"
  github           : "rezashkv"
  linkedin         : "reza-shirkavand-3b508612b/"
  twitter          : *twitter

# ==========================================================================
#  Files
# ==========================================================================

include:
  - .htaccess
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG.md
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - markdown_generator
  - node_modules
  - package.json
  - talkmap
  - talkmap.ipynb
  - talkmap.py
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# ==========================================================================
#  Conversion
# ==========================================================================

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# ==========================================================================
#  Collections
# ==========================================================================

collections:
  publications:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: publications
    values:
      layout: publication

# ==========================================================================
#  Output
# ==========================================================================

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: America/New_York

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

whitelist:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
