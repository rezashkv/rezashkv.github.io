<script>
(function () {
  "use strict";

  var masthead = document.getElementById("masthead");

  /* The intro's profile-link row; once it scrolls under the masthead, the
     masthead reveals its own compact copy. */
  var introContacts = document.querySelector(".intro .contacts");
  var condenseAt = Infinity;

  /* Nav links pointing at a section on this page, paired with their section. */
  var sections = [].slice
    .call(document.querySelectorAll(".nav__link[data-anchor]"))
    .map(function (link) {
      var el = document.getElementById(link.getAttribute("data-anchor"));
      return el ? { link: link, el: el, top: 0 } : null;
    })
    .filter(Boolean);

  var active;

  /* Section offsets are measured once per layout, so scrolling only compares numbers. */
  function offsetTop(el) {
    var y = 0;
    while (el) {
      y += el.offsetTop;
      el = el.offsetParent;
    }
    return y;
  }

  function measure() {
    if (introContacts && masthead) {
      condenseAt = offsetTop(introContacts) + introContacts.offsetHeight - masthead.offsetHeight;
    }

    sections.forEach(function (item) {
      item.top = offsetTop(item.el);
    });
  }

  function update() {
    var y = window.pageYOffset;

    if (masthead) {
      /* Hairline under the masthead once the page has moved. */
      masthead.classList.toggle("is-stuck", y > 8);
      /* Profile links join the masthead once the intro's row is out of view. */
      masthead.classList.toggle("is-condensed", y > condenseAt);
    }

    if (!sections.length) return;

    /* Whichever section sits under a line a third of the way down the viewport. */
    var line = y + window.innerHeight * 0.33;
    var current = null;

    for (var i = 0; i < sections.length; i++) {
      if (sections[i].top <= line) current = sections[i];
    }

    /* At the very bottom the last section always wins, however short it is. */
    if (y + window.innerHeight >= document.documentElement.scrollHeight - 2) {
      current = sections[sections.length - 1];
    }

    if (current === active) return;
    active = current;
    sections.forEach(function (item) {
      item.link.classList.toggle("is-active", item === current);
    });
  }

  function remeasure() {
    measure();
    update();
  }

  measure();
  update();

  window.addEventListener("scroll", update, { passive: true });
  window.addEventListener("resize", remeasure, { passive: true });
  window.addEventListener("load", remeasure);
})();
</script>

<script>
(function () {
  "use strict";

  /* "Earlier news" disclosure. */
  var toggle = document.querySelector("[data-disclose]");
  if (!toggle) return;

  var extras = [].slice.call(
    document.querySelectorAll("#" + toggle.getAttribute("data-disclose") + " .news__more")
  );

  toggle.addEventListener("click", function () {
    var open = toggle.getAttribute("aria-expanded") === "true";
    toggle.setAttribute("aria-expanded", String(!open));
    toggle.textContent = open ? toggle.dataset.labelClosed : toggle.dataset.labelOpen;
    extras.forEach(function (el) {
      el.hidden = open;
    });
  });
})();
</script>
